<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz | Student Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-bg">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Student Quiz</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">Student: <strong id="studentName"></strong></span>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center py-4 py-md-5">
            <div class="col-12 col-md-10 col-lg-8">

                <div id="message" class="alert d-none" role="alert"></div>

                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted">Loading questions...</p>
                </div>

                <div id="quizBox" class="card app-card shadow-lg d-none">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span id="questionNumber" class="fw-semibold"></span>
                            <span id="timer" class="badge text-bg-primary fs-6">30s</span>
                        </div>
                        <div class="progress mb-1" style="height: 10px;">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <div class="text-end text-muted small mb-4" id="progressText"></div>

                        <h2 id="questionText" class="h4 mb-4"></h2>
                        <div id="answers" class="d-grid gap-2 mb-4"></div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button id="prevBtn" class="btn btn-outline-secondary btn-lg w-100">Previous</button>
                            </div>
                            <div class="col-6">
                                <button id="nextBtn" class="btn btn-primary btn-lg w-100">Next</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/quiz.js"></script>
</body>

</html>
