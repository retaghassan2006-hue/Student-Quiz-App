<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Student Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-bg">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card app-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 text-center mb-1">Create Account</h1>
                        <p class="text-center text-muted mb-4">Register to take the quiz</p>

                        <div id="message" class="alert d-none" role="alert"></div>

                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="John Smith">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="you@example.com">
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="At least 6 characters">
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 btn-lg">Register</button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account? <a href="index.html">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
