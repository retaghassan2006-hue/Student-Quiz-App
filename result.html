<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result | Student Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-bg">
    <div class="container">
        <div class="row justify-content-center py-4 py-md-5">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card app-card shadow-lg text-center">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-1">Quiz Result</h1>
                        <p class="text-muted mb-4">Well done for finishing, <strong id="studentName"></strong>!</p>

                        <div class="row g-3 mb-4">
                            <div class="col-12 col-sm-4">
                                <div class="stat-box">
                                    <div class="stat-value" id="score">0</div>
                                    <div class="stat-label">Score</div>
                                </div>
                            </div>
                            <div class="col-12 col-sm-4">
                                <div class="stat-box">
                                    <div class="stat-value" id="total">0</div>
                                    <div class="stat-label">Questions</div>
                                </div>
                            </div>
                            <div class="col-12 col-sm-4">
                                <div class="stat-box">
                                    <div class="stat-value" id="percentage">0%</div>
                                    <div class="stat-label">Percentage</div>
                                </div>
                            </div>
                        </div>

                        <div id="status" class="alert" role="alert"></div>

                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
                            <button id="retryBtn" class="btn btn-primary btn-lg px-4">Try Again</button>
                            <button id="logoutBtn" class="btn btn-outline-danger btn-lg px-4">Logout</button>
                        </div>

                        <hr class="my-4">

                        <h2 class="h5 mb-3">Your Previous Attempts</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-sm align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date</th>
                                        <th>Score</th>
                                        <th>%</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="historyBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/result.js"></script>
</body>

</html>
